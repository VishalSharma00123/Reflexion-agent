[project]
name = "reflexion-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "VishalSharma00123", email = "vishal2k21ml@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.8",
    "langchain-nvidia-ai-endpoints>=1.5.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.19",
    "python-dotenv>=1.2.4",
]

[project.scripts]
reflexion-agent = "reflexion_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
]
